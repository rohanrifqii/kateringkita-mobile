<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pesan katering kampus, bayar online, ambil di titik temu.">
  <meta name="theme-color" content="#FF6B35">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KateringKita">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KateringKita</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    flutter_bootstrap.js dimuat oleh skrip di bawah setelah sisa service worker/cache versi lama dibersihkan.
    Templatnya ada di web/flutter_bootstrap.js (tanpa service worker).
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Bersihkan sisa versi lama sebelum Flutter dimuat. Versi lama aplikasi ini memasang service worker Flutter
    // yang menyimpan salinan berkas di Cache Storage; browser yang pernah membukanya bisa terus memakai salinan basi
    // itu sehingga aplikasi error sampai data situs dihapus manual. Di sini semua service worker dicabut dan cache
    // dihapus; bila halaman ini masih dikendalikan service worker lama, muat ulang sekali (dijaga sessionStorage
    // supaya tidak berulang). Sesudah itu flutter_bootstrap.js dimuat seperti biasa.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.controller && !sessionStorage.getItem('kk_sw_dibersihkan')) {
          sessionStorage.setItem('kk_sw_dibersihkan', '1');
          location.reload();
          return;
        }
      } catch (error) {
        console.warn('Gagal membersihkan service worker/cache lama:', error);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
